name: Release userscript

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate before releasing
        run: npm test
      - name: Require matching tag and userscript version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(node -p "require('./package.json').version")"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" chatgpt-quota-monitor.user.js \
            --title "$TAG" \
            --generate-notes
